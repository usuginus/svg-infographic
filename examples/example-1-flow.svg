<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="'Hiragino Sans', 'Yu Gothic UI', 'Noto Sans JP', system-ui, sans-serif" role="img" aria-label="How a patron reserves a book and picks it up, and where the system is involved">
<title>Library book reservation flow</title>
<defs><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.07"/></filter></defs>
<rect width="960" height="540" fill="#F8FAFC"/>
<text x="24.0" y="42.0" font-size="20" font-weight="600" fill="#1E293B" text-anchor="start">Returned books go straight to the next patron in line</text>
<text x="936.0" y="42.0" font-size="12" font-weight="400" fill="#64748B" text-anchor="end">Process flow</text>
<text x="24.0" y="96.0" font-size="15" font-weight="600" fill="#1E293B" text-anchor="start">From reservation to pickup</text>
<rect x="24.0" y="116.0" width="195.0" height="112.0" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#sh)"/>
<g transform="translate(109.5,130.0) scale(1.0000)" fill="none" stroke="#64748B" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4,21 C4,16.6 7.6,14 12,14 C16.4,14 20,16.6 20,21"/></g>
<text x="121.5" y="174.0" font-size="13" font-weight="600" fill="#1E293B" text-anchor="middle">Patron</text>
<text x="121.5" y="194.0" font-size="12" font-weight="400" fill="#64748B" text-anchor="middle">Searches the catalog</text>
<text x="121.5" y="211.0" font-size="12" font-weight="400" fill="#64748B" text-anchor="middle">and reserves a book</text>
<path d="M225.0,172.0 L257.0,172.0 M251.2,176.0 L257.0,172.0 L251.2,168.0" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<rect x="263.0" y="116.0" width="195.0" height="112.0" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="1" filter="url(#sh)"/>
<g transform="translate(348.5,130.0) scale(1.0000)" fill="none" stroke="#2563EB" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><circle cx="7" cy="7.5" r="0.9" fill="#2563EB" stroke="none"/><circle cx="7" cy="16.5" r="0.9" fill="#2563EB" stroke="none"/><path d="M11,7.5 H17 M11,16.5 H17"/></g>
<text x="360.5" y="174.0" font-size="13" font-weight="600" fill="#2563EB" text-anchor="middle">Reservation system</text>
<text x="360.5" y="194.0" font-size="12" font-weight="400" fill="#64748B" text-anchor="middle">Checks availability</text>
<text x="360.5" y="211.0" font-size="12" font-weight="400" fill="#64748B" text-anchor="middle">and sets the queue</text>
<path d="M464.0,172.0 L496.0,172.0 M490.2,176.0 L496.0,172.0 L490.2,168.0" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<rect x="502.0" y="116.0" width="195.0" height="112.0" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#sh)"/>
<g transform="translate(587.5,130.0) scale(1.0000)" fill="none" stroke="#64748B" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6,16 V11 A6,6 0 0 1 18,11 V16 L19.5,18 H4.5 Z"/><path d="M10,21 H14"/></g>
<text x="599.5" y="174.0" font-size="13" font-weight="600" fill="#1E293B" text-anchor="middle">Notification</text>
<text x="599.5" y="194.0" font-size="12" font-weight="400" fill="#64748B" text-anchor="middle">Emails the patron</text>
<text x="599.5" y="211.0" font-size="12" font-weight="400" fill="#64748B" text-anchor="middle">when the book is ready</text>
<path d="M703.0,172.0 L735.0,172.0 M729.2,176.0 L735.0,172.0 L729.2,168.0" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<rect x="741.0" y="116.0" width="195.0" height="112.0" rx="12" fill="#FFFFFF" stroke="#10B981" stroke-width="1" filter="url(#sh)"/>
<g transform="translate(826.5,130.0) scale(1.0000)" fill="none" stroke="#10B981" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="1.5"/><path d="M8,7.5 H10 M14,7.5 H16 M8,11.5 H10 M14,11.5 H16 M10,21 V16.5 H14 V21"/></g>
<text x="838.5" y="174.0" font-size="13" font-weight="600" fill="#10B981" text-anchor="middle">Library desk</text>
<text x="838.5" y="194.0" font-size="12" font-weight="400" fill="#64748B" text-anchor="middle">Patron picks it up</text>
<text x="838.5" y="211.0" font-size="12" font-weight="400" fill="#64748B" text-anchor="middle">within 7 days</text>
<text x="24.0" y="282.0" font-size="15" font-weight="600" fill="#1E293B" text-anchor="start">When the book is on loan</text>
<circle cx="36.0" cy="318.0" r="12" fill="#2563EB"/>
<text x="36.0" y="323.0" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="58.0" y="317.0" font-size="14" font-weight="600" fill="#1E293B" text-anchor="start">Join the queue</text>
<text x="58.0" y="336.0" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">Patrons who reserved the same book are queued by request time</text>
<line x1="36.0" y1="334.0" x2="36.0" y2="358.0" stroke="#E2E8F0" stroke-width="2"/>
<circle cx="36.0" cy="374.0" r="12" fill="#2563EB"/>
<text x="36.0" y="379.0" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="58.0" y="373.0" font-size="14" font-weight="600" fill="#1E293B" text-anchor="start">Assign on return</text>
<text x="58.0" y="392.0" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">When the book is returned, it goes to the first patron in the queue</text>
<line x1="36.0" y1="390.0" x2="36.0" y2="414.0" stroke="#E2E8F0" stroke-width="2"/>
<circle cx="36.0" cy="430.0" r="12" fill="#2563EB"/>
<text x="36.0" y="435.0" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="58.0" y="429.0" font-size="14" font-weight="600" fill="#1E293B" text-anchor="start">Pass it on if not picked up</text>
<text x="58.0" y="448.0" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">The pickup period is 7 days. After that, the next patron gets it</text>
<rect x="560.0" y="300.0" width="376.0" height="150.0" rx="14" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4 4"/>
<text x="574.0" y="319.0" font-size="12" font-weight="600" fill="#64748B" text-anchor="start">What the patron sees</text>
<circle cx="583.0" cy="343.4" r="2.5" fill="#94A3B8"/>
<text x="592.0" y="348.0" font-size="13" font-weight="400" fill="#1E293B" text-anchor="start">Two states: "In queue" and "Ready"</text>
<circle cx="583.0" cy="377.4" r="2.5" fill="#94A3B8"/>
<text x="592.0" y="382.0" font-size="13" font-weight="400" fill="#1E293B" text-anchor="start">While in queue, their position is shown</text>
<circle cx="583.0" cy="411.4" r="2.5" fill="#94A3B8"/>
<text x="592.0" y="416.0" font-size="13" font-weight="400" fill="#1E293B" text-anchor="start">"Ready" is sent by email and on the web</text>
</svg>
