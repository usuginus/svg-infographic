<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="'Hiragino Sans', 'Yu Gothic UI', 'Noto Sans JP', system-ui, sans-serif" role="img" aria-label="Timeline and follow-up actions for a search outage on a Monday morning">
<title>Reservation system incident review</title>
<defs><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.07"/></filter></defs>
<rect width="960" height="540" fill="#F8FAFC"/>
<text x="24.0" y="42.0" font-size="20" font-weight="600" fill="#1E293B" text-anchor="start">Cause: a Monday spike maxed out the search server's CPU</text>
<text x="936.0" y="42.0" font-size="12" font-weight="400" fill="#64748B" text-anchor="end">Incident review</text>
<rect x="24.0" y="64.0" width="296.0" height="58.0" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#sh)"/>
<text x="44.0" y="86.0" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">Downtime</text>
<text x="44.0" y="109.0" font-size="16" font-weight="500" fill="#F97316" text-anchor="start">About 15 min</text>
<g transform="translate(278.0,82.0) scale(0.9167)" fill="none" stroke="#F97316" stroke-width="1.91" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12,7 V12 L15.5,14"/></g>
<rect x="332.0" y="64.0" width="296.0" height="58.0" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#sh)"/>
<text x="352.0" y="86.0" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">Affected reservations</text>
<text x="352.0" y="109.0" font-size="16" font-weight="500" fill="#1E293B" text-anchor="start">120</text>
<g transform="translate(586.0,82.0) scale(0.9167)" fill="none" stroke="#64748B" stroke-width="1.91" stroke-linecap="round" stroke-linejoin="round"><path d="M6,2.5 H14 L19,7.5 V21.5 H6 Z"/><path d="M14,2.5 V7.5 H19 M9,12.5 H16 M9,16.5 H16"/></g>
<rect x="640.0" y="64.0" width="296.0" height="58.0" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#sh)"/>
<text x="660.0" y="86.0" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">Follow-up actions</text>
<text x="660.0" y="109.0" font-size="16" font-weight="500" fill="#1E293B" text-anchor="start">3 (2 done)</text>
<g transform="translate(894.0,82.0) scale(0.9167)" fill="none" stroke="#64748B" stroke-width="1.91" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8,12.3 L11,15.3 L16.3,9.3"/></g>
<text x="24.0" y="164.0" font-size="15" font-weight="600" fill="#1E293B" text-anchor="start">Timeline</text>
<line x1="24.0" y1="222.0" x2="936.0" y2="222.0" stroke="#E2E8F0" stroke-width="2"/>
<circle cx="30.0" cy="222.0" r="5" fill="#2563EB"/>
<text x="24.0" y="208.0" font-size="14" font-weight="600" fill="#1E293B" text-anchor="start">9:00</text>
<text x="24.0" y="250.0" font-size="13" font-weight="600" fill="#1E293B" text-anchor="start">Spike at opening</text>
<text x="24.0" y="270.0" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">Search responses</text>
<text x="24.0" y="288.0" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">start to slow down</text>
<circle cx="262.0" cy="222.0" r="5" fill="#F97316"/>
<text x="256.0" y="208.0" font-size="14" font-weight="600" fill="#F97316" text-anchor="start">9:05</text>
<text x="256.0" y="250.0" font-size="13" font-weight="600" fill="#F97316" text-anchor="start">Search stops</text>
<text x="256.0" y="270.0" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">CPU hits its limit and</text>
<text x="256.0" y="288.0" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">requests time out</text>
<circle cx="494.0" cy="222.0" r="5" fill="#2563EB"/>
<text x="488.0" y="208.0" font-size="14" font-weight="600" fill="#2563EB" text-anchor="start">9:12</text>
<text x="488.0" y="250.0" font-size="13" font-weight="600" fill="#2563EB" text-anchor="start">Servers added</text>
<text x="488.0" y="270.0" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">Search servers go</text>
<text x="488.0" y="288.0" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">from 2 to 4</text>
<circle cx="726.0" cy="222.0" r="5" fill="#10B981"/>
<text x="720.0" y="208.0" font-size="14" font-weight="600" fill="#10B981" text-anchor="start">9:20</text>
<text x="720.0" y="250.0" font-size="13" font-weight="600" fill="#10B981" text-anchor="start">Recovered</text>
<text x="720.0" y="270.0" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">Search responds at</text>
<text x="720.0" y="288.0" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">normal speed again</text>
<text x="24.0" y="340.0" font-size="15" font-weight="600" fill="#1E293B" text-anchor="start">Follow-up actions</text>
<rect x="24.0" y="358.0" width="912.0" height="46.0" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#sh)"/>
<text x="44.0" y="386.0" font-size="14" font-weight="600" fill="#1E293B" text-anchor="start">Scale up before opening</text>
<text x="314.0" y="386.0" font-size="12.5" font-weight="400" fill="#64748B" text-anchor="start">Run 4 servers from 8:30 on Mondays and after holidays</text>
<circle cx="830.0" cy="382.0" r="3.5" fill="#10B981"/>
<text x="840.0" y="386.0" font-size="12" font-weight="500" fill="#10B981" text-anchor="start">Done</text>
<rect x="24.0" y="410.0" width="912.0" height="46.0" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#sh)"/>
<text x="44.0" y="438.0" font-size="14" font-weight="600" fill="#1E293B" text-anchor="start">Alert on CPU usage</text>
<text x="314.0" y="438.0" font-size="12.5" font-weight="400" fill="#64748B" text-anchor="start">Notify the on-call person when CPU stays above 80% for 5 min</text>
<circle cx="830.0" cy="434.0" r="3.5" fill="#10B981"/>
<text x="840.0" y="438.0" font-size="12" font-weight="500" fill="#10B981" text-anchor="start">Done</text>
<rect x="24.0" y="462.0" width="912.0" height="46.0" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#sh)"/>
<text x="44.0" y="490.0" font-size="14" font-weight="600" fill="#1E293B" text-anchor="start">Cache search results</text>
<text x="314.0" y="490.0" font-size="12.5" font-weight="400" fill="#64748B" text-anchor="start">Return cached results for repeated searches to reduce load</text>
<circle cx="830.0" cy="486.0" r="3.5" fill="#F97316"/>
<text x="840.0" y="490.0" font-size="12" font-weight="500" fill="#F97316" text-anchor="start">In progress</text>
</svg>
