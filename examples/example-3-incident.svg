<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="'Hiragino Sans', 'Yu Gothic UI', 'Noto Sans JP', system-ui, sans-serif" role="img" aria-label="月曜の朝に予約システムの検索が止まった障害の経緯と再発防止策">
<title>予約システムの障害の振り返り</title>
<defs><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.07"/></filter></defs>
<rect width="960" height="540" fill="#F8FAFC"/>
<text x="24.0" y="42.0" font-size="20" font-weight="600" fill="#1E293B" text-anchor="start">原因：月曜の朝に予約が集中し、検索サーバーの CPU が上限に達した</text>
<text x="936.0" y="42.0" font-size="12" font-weight="400" fill="#64748B" text-anchor="end">障害の振り返り</text>
<rect x="24.0" y="64.0" width="296.0" height="58.0" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#sh)"/>
<text x="44.0" y="86.0" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">止まった時間</text>
<text x="44.0" y="109.0" font-size="16" font-weight="500" fill="#F97316" text-anchor="start">約 15 分</text>
<g transform="translate(278.0,82.0) scale(0.9167)" fill="none" stroke="#F97316" stroke-width="1.91" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12,7 V12 L15.5,14"/></g>
<rect x="332.0" y="64.0" width="296.0" height="58.0" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#sh)"/>
<text x="352.0" y="86.0" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">影響した予約</text>
<text x="352.0" y="109.0" font-size="16" font-weight="500" fill="#1E293B" text-anchor="start">120 件</text>
<g transform="translate(586.0,82.0) scale(0.9167)" fill="none" stroke="#64748B" stroke-width="1.91" stroke-linecap="round" stroke-linejoin="round"><path d="M6,2.5 H14 L19,7.5 V21.5 H6 Z"/><path d="M14,2.5 V7.5 H19 M9,12.5 H16 M9,16.5 H16"/></g>
<rect x="640.0" y="64.0" width="296.0" height="58.0" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#sh)"/>
<text x="660.0" y="86.0" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">再発防止策</text>
<text x="660.0" y="109.0" font-size="16" font-weight="500" fill="#1E293B" text-anchor="start">3 件（2 件完了）</text>
<g transform="translate(894.0,82.0) scale(0.9167)" fill="none" stroke="#64748B" stroke-width="1.91" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8,12.3 L11,15.3 L16.3,9.3"/></g>
<text x="24.0" y="164.0" font-size="15" font-weight="600" fill="#1E293B" text-anchor="start">経緯</text>
<line x1="24.0" y1="222.0" x2="936.0" y2="222.0" stroke="#E2E8F0" stroke-width="2"/>
<circle cx="30.0" cy="222.0" r="5" fill="#2563EB"/>
<text x="24.0" y="208.0" font-size="14" font-weight="600" fill="#1E293B" text-anchor="start">9:00</text>
<text x="24.0" y="250.0" font-size="13" font-weight="600" fill="#1E293B" text-anchor="start">開館と同時に予約が集中</text>
<text x="24.0" y="270.0" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">検索の応答が</text>
<text x="24.0" y="288.0" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">遅くなり始める</text>
<circle cx="262.0" cy="222.0" r="5" fill="#F97316"/>
<text x="256.0" y="208.0" font-size="14" font-weight="600" fill="#F97316" text-anchor="start">9:05</text>
<text x="256.0" y="250.0" font-size="13" font-weight="600" fill="#F97316" text-anchor="start">検索が止まる</text>
<text x="256.0" y="270.0" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">CPU が上限に達し</text>
<text x="256.0" y="288.0" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">応答を返せなくなる</text>
<circle cx="494.0" cy="222.0" r="5" fill="#2563EB"/>
<text x="488.0" y="208.0" font-size="14" font-weight="600" fill="#2563EB" text-anchor="start">9:12</text>
<text x="488.0" y="250.0" font-size="13" font-weight="600" fill="#2563EB" text-anchor="start">サーバーを追加</text>
<text x="488.0" y="270.0" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">検索サーバーを</text>
<text x="488.0" y="288.0" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">2 台から 4 台にする</text>
<circle cx="726.0" cy="222.0" r="5" fill="#10B981"/>
<text x="720.0" y="208.0" font-size="14" font-weight="600" fill="#10B981" text-anchor="start">9:20</text>
<text x="720.0" y="250.0" font-size="13" font-weight="600" fill="#10B981" text-anchor="start">復旧</text>
<text x="720.0" y="270.0" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">検索が通常の</text>
<text x="720.0" y="288.0" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">速さに戻る</text>
<text x="24.0" y="340.0" font-size="15" font-weight="600" fill="#1E293B" text-anchor="start">再発防止策</text>
<rect x="24.0" y="358.0" width="912.0" height="46.0" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#sh)"/>
<text x="44.0" y="386.0" font-size="14" font-weight="600" fill="#1E293B" text-anchor="start">開館前にサーバーを増やす</text>
<text x="324.0" y="386.0" font-size="12.5" font-weight="400" fill="#64748B" text-anchor="start">月曜と祝日明けは 8:30 に 4 台にしておく</text>
<circle cx="850.0" cy="382.0" r="3.5" fill="#10B981"/>
<text x="860.0" y="386.0" font-size="12" font-weight="500" fill="#10B981" text-anchor="start">完了</text>
<rect x="24.0" y="410.0" width="912.0" height="46.0" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#sh)"/>
<text x="44.0" y="438.0" font-size="14" font-weight="600" fill="#1E293B" text-anchor="start">CPU の使用率で警告を出す</text>
<text x="324.0" y="438.0" font-size="12.5" font-weight="400" fill="#64748B" text-anchor="start">80% を 5 分超えたら担当者に知らせる</text>
<circle cx="850.0" cy="434.0" r="3.5" fill="#10B981"/>
<text x="860.0" y="438.0" font-size="12" font-weight="500" fill="#10B981" text-anchor="start">完了</text>
<rect x="24.0" y="462.0" width="912.0" height="46.0" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#sh)"/>
<text x="44.0" y="490.0" font-size="14" font-weight="600" fill="#1E293B" text-anchor="start">検索結果を一時保存する</text>
<text x="324.0" y="490.0" font-size="12.5" font-weight="400" fill="#64748B" text-anchor="start">同じ検索は保存した結果を返し、負荷を減らす</text>
<circle cx="850.0" cy="486.0" r="3.5" fill="#F97316"/>
<text x="860.0" y="490.0" font-size="12" font-weight="500" fill="#F97316" text-anchor="start">対応中</text>
</svg>
