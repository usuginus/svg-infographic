<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="'Hiragino Sans', 'Yu Gothic UI', 'Noto Sans JP', 'Noto Sans CJK JP', system-ui, sans-serif" role="img" aria-label="Swimlane of the patron, the reservation system, and the library desk">
<title>Who handles a reservation</title>
<defs><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.07"/></filter></defs>
<rect width="960" height="540" fill="#F8FAFC"/>
<text x="24.0" y="42.0" font-size="20" font-weight="600" fill="#1E293B" text-anchor="start" data-maxw="692.0">Staff touch a reservation only once, to set the book aside</text>
<text x="936.0" y="42.0" font-size="12" font-weight="400" fill="#64748B" text-anchor="end">Swimlane</text>
<rect x="24.0" y="70.0" width="912.0" height="88" fill="#F1F5F9"/>
<text x="38.0" y="119.0" font-size="13" font-weight="600" fill="#1E293B" text-anchor="start" data-maxw="104.1">Patron</text>
<rect x="24.0" y="158.0" width="912.0" height="88" fill="#F8FAFC"/>
<text x="38.0" y="207.0" font-size="13" font-weight="600" fill="#1E293B" text-anchor="start" data-maxw="104.1">System</text>
<rect x="24.0" y="246.0" width="912.0" height="88" fill="#F1F5F9"/>
<text x="38.0" y="295.0" font-size="13" font-weight="600" fill="#1E293B" text-anchor="start" data-maxw="104.1">Library desk</text>
<line x1="152.1" y1="70.0" x2="152.1" y2="334.0" stroke="#E2E8F0" stroke-width="1"/>
<rect x="188.1" y="90.0" width="124.0" height="48.0" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" data-part="box"/>
<text x="250.1" y="118.7" font-size="13" font-weight="600" fill="#1E293B" text-anchor="middle" data-maxw="108.0">Reserve online</text>
<rect x="384.1" y="178.0" width="124.0" height="48.0" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.2" data-part="box"/>
<text x="446.1" y="206.7" font-size="13" font-weight="600" fill="#2563EB" text-anchor="middle" data-maxw="108.0">Assign a copy</text>
<rect x="580.1" y="178.0" width="124.0" height="48.0" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" data-part="box"/>
<text x="642.1" y="199.0" font-size="13" font-weight="600" fill="#1E293B" text-anchor="middle" data-maxw="108.0">Email the</text>
<text x="642.1" y="216.0" font-size="13" font-weight="600" fill="#1E293B" text-anchor="middle" data-maxw="108.0">patron</text>
<rect x="580.1" y="266.0" width="124.0" height="48.0" rx="10" fill="#FFFFFF" stroke="#F97316" stroke-width="1.2" data-part="box"/>
<text x="642.1" y="287.0" font-size="13" font-weight="600" fill="#F97316" text-anchor="middle" data-maxw="108.0">Set the book</text>
<text x="642.1" y="304.0" font-size="13" font-weight="600" fill="#F97316" text-anchor="middle" data-maxw="108.0">aside</text>
<rect x="776.0" y="90.0" width="124.0" height="48.0" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="1.2" data-part="box"/>
<text x="838.0" y="118.7" font-size="13" font-weight="600" fill="#10B981" text-anchor="middle" data-maxw="108.0">Pick it up</text>
<path d="M316.1,114.0 L348.1,114.0 L348.1,202.0 L378.1,202.0 M372.3,206.0 L378.1,202.0 L372.3,198.0" stroke="#94A3B8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" data-part="arrow"/>
<path d="M514.1,202.0 L574.1,202.0 M568.3,206.0 L574.1,202.0 L568.3,198.0" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" data-part="arrow"/>
<path d="M642.1,230.0 L642.1,262.0 M638.1,256.2 L642.1,262.0 L646.0,256.2" stroke="#94A3B8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" data-part="arrow"/>
<path d="M708.0,290.0 L740.0,290.0 L740.0,114.0 L770.0,114.0 M764.3,118.0 L770.0,114.0 L764.3,110.0" stroke="#94A3B8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" data-part="arrow"/>
<rect x="24.0" y="358.0" width="424.0" height="134.0" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#sh)" data-part="box"/>
<text x="44.0" y="388.0" font-size="15" font-weight="600" fill="#1E293B" text-anchor="start" data-maxw="384.0">Before</text>
<circle cx="47.0" cy="413.5" r="2.5" fill="#94A3B8"/>
<text x="58.0" y="418.0" font-size="13" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="370.0">Patrons phone or visit the desk</text>
<circle cx="47.0" cy="439.5" r="3" fill="#F97316"/>
<text x="58.0" y="444.0" font-size="13" font-weight="500" fill="#F97316" text-anchor="start" data-maxw="370.0">Staff search the shelves for a copy</text>
<circle cx="47.0" cy="465.5" r="3" fill="#F97316"/>
<text x="58.0" y="470.0" font-size="13" font-weight="500" fill="#F97316" text-anchor="start" data-maxw="370.0">Staff call the patron when it is ready</text>
<rect x="512.0" y="358.0" width="424.0" height="134.0" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#sh)" data-part="box"/>
<text x="532.0" y="388.0" font-size="15" font-weight="600" fill="#1E293B" text-anchor="start" data-maxw="384.0">After</text>
<circle cx="535.0" cy="413.5" r="2.5" fill="#94A3B8"/>
<text x="546.0" y="418.0" font-size="13" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="370.0">Patrons reserve on the web</text>
<circle cx="535.0" cy="439.5" r="3" fill="#10B981"/>
<text x="546.0" y="444.0" font-size="13" font-weight="500" fill="#10B981" text-anchor="start" data-maxw="370.0">The system assigns a copy</text>
<circle cx="535.0" cy="465.5" r="3" fill="#10B981"/>
<text x="546.0" y="470.0" font-size="13" font-weight="500" fill="#10B981" text-anchor="start" data-maxw="370.0">The system emails the patron</text>
<path d="M462.0,425.0 L498.0,425.0 M492.2,429.0 L498.0,425.0 L492.2,421.0" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" data-part="arrow"/>
</svg>
