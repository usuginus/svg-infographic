<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="'Hiragino Sans', 'Yu Gothic UI', 'Noto Sans JP', 'Noto Sans CJK JP', system-ui, sans-serif" role="img" aria-label="Email, push notifications, and SMS compared by speed, cost, and best use">
<title>Comparing notification channels</title>
<defs><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.07"/></filter></defs>
<rect width="960" height="540" fill="#F8FAFC"/>
<text x="24.0" y="42.0" font-size="20" font-weight="600" fill="#1E293B" text-anchor="start" data-maxw="692.0">Send urgent notices by push, and notices to keep by email</text>
<text x="936.0" y="42.0" font-size="12" font-weight="400" fill="#64748B" text-anchor="end">Comparison</text>
<text x="24.0" y="96.0" font-size="15" font-weight="600" fill="#1E293B" text-anchor="start" data-maxw="912.0">How the three channels differ</text>
<rect x="24.0" y="112.0" width="912.0" height="162.0" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#sh)" data-part="box"/>
<text x="40.0" y="132.0" font-size="12" font-weight="500" fill="#64748B" text-anchor="start">Channel</text>
<text x="164.0" y="132.0" font-size="12" font-weight="500" fill="#64748B" text-anchor="start">Delivery</text>
<text x="334.0" y="132.0" font-size="12" font-weight="500" fill="#64748B" text-anchor="start">Cost</text>
<text x="494.0" y="132.0" font-size="12" font-weight="500" fill="#64748B" text-anchor="start">Kept as a record</text>
<text x="644.0" y="132.0" font-size="12" font-weight="500" fill="#64748B" text-anchor="start">Best for</text>
<line x1="24.0" y1="142.0" x2="936.0" y2="142.0" stroke="#E2E8F0" stroke-width="1"/>
<text x="40.0" y="169.0" font-size="13" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="112.0">Email</text>
<text x="164.0" y="169.0" font-size="12.5" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="158.0">Seconds to minutes</text>
<text x="334.0" y="169.0" font-size="12.5" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="148.0">Nearly free</text>
<text x="494.0" y="169.0" font-size="12.5" font-weight="500" fill="#10B981" text-anchor="start" data-maxw="138.0">Yes</text>
<text x="644.0" y="169.0" font-size="12.5" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="280.0">Receipts, confirmations</text>
<rect x="25.0" y="186.0" width="910.0" height="44" fill="#EFF6FF"/>
<line x1="24.0" y1="186.0" x2="936.0" y2="186.0" stroke="#E2E8F0" stroke-width="1"/>
<text x="40.0" y="213.0" font-size="13" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="112.0">Push</text>
<text x="164.0" y="213.0" font-size="12.5" font-weight="500" fill="#10B981" text-anchor="start" data-maxw="158.0">Seconds</text>
<text x="334.0" y="213.0" font-size="12.5" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="148.0">Nearly free</text>
<text x="494.0" y="213.0" font-size="12.5" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="138.0">Rarely</text>
<text x="644.0" y="213.0" font-size="12.5" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="280.0">Notices with a close deadline</text>
<line x1="24.0" y1="230.0" x2="936.0" y2="230.0" stroke="#E2E8F0" stroke-width="1"/>
<text x="40.0" y="257.0" font-size="13" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="112.0">SMS</text>
<text x="164.0" y="257.0" font-size="12.5" font-weight="500" fill="#10B981" text-anchor="start" data-maxw="158.0">Seconds</text>
<text x="334.0" y="257.0" font-size="12.5" font-weight="500" fill="#F97316" text-anchor="start" data-maxw="148.0">Charged per message</text>
<text x="494.0" y="257.0" font-size="12.5" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="138.0">On the device</text>
<text x="644.0" y="257.0" font-size="12.5" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="280.0">Verification codes</text>
<text x="24.0" y="330.0" font-size="15" font-weight="600" fill="#1E293B" text-anchor="start" data-maxw="912.0">How to choose</text>
<rect x="24.0" y="350.0" width="380.0" height="64.0" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#sh)" data-part="box"/>
<text x="44.0" y="377.0" font-size="14" font-weight="600" fill="#1E293B" text-anchor="start" data-maxw="340.0">Must it be read today?</text>
<text x="44.0" y="398.0" font-size="12" font-weight="400" fill="#64748B" text-anchor="start" data-maxw="340.0">A deadline or pickup period is close</text>
<path d="M416.0,382.0 L516.0,382.0 M510.2,386.0 L516.0,382.0 L510.2,378.0" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" data-part="arrow"/>
<text x="466.0" y="374.0" font-size="12" font-weight="400" fill="#64748B" text-anchor="middle">Yes</text>
<rect x="524.0" y="350.0" width="412.0" height="64.0" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="1" filter="url(#sh)" data-part="box"/>
<text x="544.0" y="377.0" font-size="14" font-weight="600" fill="#2563EB" text-anchor="start" data-maxw="372.0">Send a push notification</text>
<text x="544.0" y="398.0" font-size="12" font-weight="400" fill="#64748B" text-anchor="start" data-maxw="372.0">Also email patrons who do not have the app</text>
<rect x="24.0" y="432.0" width="380.0" height="64.0" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#sh)" data-part="box"/>
<text x="44.0" y="459.0" font-size="14" font-weight="600" fill="#1E293B" text-anchor="start" data-maxw="340.0">Will they need to look it up later?</text>
<text x="44.0" y="480.0" font-size="12" font-weight="400" fill="#64748B" text-anchor="start" data-maxw="340.0">Receipts, confirmations, changes to terms</text>
<path d="M416.0,464.0 L516.0,464.0 M510.2,468.0 L516.0,464.0 L510.2,460.0" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" data-part="arrow"/>
<text x="466.0" y="456.0" font-size="12" font-weight="400" fill="#64748B" text-anchor="middle">Yes</text>
<rect x="524.0" y="432.0" width="412.0" height="64.0" rx="12" fill="#FFFFFF" stroke="#10B981" stroke-width="1" filter="url(#sh)" data-part="box"/>
<text x="544.0" y="459.0" font-size="14" font-weight="600" fill="#10B981" text-anchor="start" data-maxw="372.0">Send an email</text>
<text x="544.0" y="480.0" font-size="12" font-weight="400" fill="#64748B" text-anchor="start" data-maxw="372.0">Put the topic and date in the subject</text>
</svg>
